spring.application.name=myday-backend

# ===== Server =====
# Hosts (Railway/Render) inject their own PORT; fall back to SERVER_PORT (local), then 8080.
server.port=${PORT:${SERVER_PORT:8080}}

# ===== Database (MySQL) =====
# Credentials come from environment variables so they are NEVER committed to Git.
# Local defaults assume MySQL running on localhost with a database named "myday".
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:myday}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
# "update" lets Hibernate create/alter tables from our @Entity classes during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Secret MUST come from an environment variable in real use. The default is for local dev only.
app.jwt.secret=${JWT_SECRET:change-me-in-env-a-very-long-random-secret-key-at-least-256-bits-long-0123456789}
# Token validity in milliseconds (default 24 hours)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
# Comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
